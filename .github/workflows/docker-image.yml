name: Docker Image CI
on:
  workflow_dispatch:


env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  USERNAME: ${{ github.actor }}
  REGISTRY: ghcr.io
  NAMESPACE: ${{ github.actor }}
  IMAGE_NAME: camino-time
  TAG: $(date +%s)

jobs:
  build_container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Git Version
        id: version
        uses: codacy/git-version@2.7.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-09-01
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-leptos
        run: |
          wget -q https://github.com/leptos-rs/cargo-leptos/releases/download/v0.3.6/cargo-leptos-x86_64-unknown-linux-musl.tar.gz
          tar -xzf cargo-leptos-x86_64-unknown-linux-musl.tar.gz
          mv cargo-leptos ~/.cargo/bin/

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.101 --force

      - name: Build
        run: cargo leptos build --release

      - name: Build Docker image
        run: docker build . --file Dockerfile ...

